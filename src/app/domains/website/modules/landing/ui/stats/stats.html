<section id="programmes" class="bg-white py-12 lg:py-20">
  <div class="mx-auto w-full max-w-screen-2xl px-5 sm:px-8 lg:px-16 xl:px-24 2xl:px-32">
    <div class="mb-8 flex flex-col items-start justify-between gap-6 sm:flex-row sm:items-end lg:mb-12">
      <div class="max-w-2xl">
        <h2 id="recent-programs-title" class="text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl lg:text-5xl">
          Pourquoi rejoindre <span class="text-brand-700">le CINOLU</span>
        </h2>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      @for (s of stats; track s.label) {
        <div
          class="relative flex flex-col p-6 lg:p-8 bg-white/95 backdrop-blur-sm rounded-lg border border-gray-200/60 hover:border-primary-300/80 transition-all duration-500 group h-full overflow-hidden">
          <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
          <div class="flex items-start justify-between mb-6">
            <div class="relative z-10 shrink-0">
              <span
                class="size-14 bg-primary-950/90 rounded-md flex items-center justify-center group-hover:scale-110 group-hover:rotate-6 transition-all duration-300 shadow-sm group-hover:shadow-md">
                <mat-icon [svgIcon]="s.icon" class="w-7 h-7 text-white stroke-[2.5]" focusable="false" />
              </span>

              <div
                class="absolute inset-0 w-14 h-14 rounded-xl blur-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 -z-10"></div>
            </div>

            <div class="relative z-10 text-right flex-1 ml-4">
              <div class="relative inline-block">
                <p class="text-3xl font-bold leading-none text-gray-800 sm:text-4xl">
                  {{ s.value }}
                </p>
                <div
                  class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-out opacity-0 group-hover:opacity-100"></div>
              </div>

              <div class="flex justify-end mt-2">
                <div class="w-8 h-0.5 bg-brand-500 rounded-full group-hover:w-12 transition-all duration-300"></div>
              </div>
            </div>
          </div>

          <div class="relative z-10">
            <div class="flex items-center mb-3">
              <div
                class="w-2 h-2 bg-primary-500 rounded-full mr-3 group-hover:scale-125 transition-transform duration-300"></div>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>
            <p
              class="text-sm leading-6 text-slate-600 sm:text-[15px] font-medium group-hover:text-gray-800 transition-colors duration-300 hyphens-none">
              {{ s.label }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
