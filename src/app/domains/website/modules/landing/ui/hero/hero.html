<section class="relative z-0 flex min-h-screen flex-col items-center justify-center py-24">
  <div class="absolute inset-0 -z-10 overflow-hidden">
    <img src="/images/member.jpg" alt="" class="h-full w-full object-cover" loading="eager" decoding="async" />
    <div class="absolute inset-0 bg-slate-950/70"></div>
  </div>

  <div class="relative z-10 mx-auto w-full max-w-screen-2xl px-5 pt-16 sm:px-8 lg:px-16 lg:pt-24 xl:px-24 2xl:px-32">
    <div class="grid grid-cols-1 items-center gap-12 lg:grid-cols-12 lg:gap-16">
      <div class="space-y-10 lg:col-span-7">
        <header class="space-y-7">
          <div class="space-y-6">
            <h1
              class="relative block max-w-3xl text-4xl leading-[1.12] font-bold tracking-tight text-white sm:text-5xl lg:text-[clamp(3rem,4vw,3.2rem)]">
              Bâtir le corridor d'innovation
              <span class="font-bold text-brand-400">de l'Afrique Centrale au monde.</span>
            </h1>
          </div>
          <p class="max-w-xl text-lg leading-8 text-slate-100">
            Nous relions l'innovation locale aux transformations mondiales en transformant les défis en opportunités de
            marché.
          </p>
        </header>
        <nav class="flex flex-col gap-3 sm:flex-row sm:gap-4" aria-label="Actions principales">
          <a matButton="filled" routerLink="/auth/sign-up" class="min-h-12 rounded-md px-6 text-base font-semibold">
            Rejoignez l'aventure
            <mat-icon class="ml-2 size-5" svgIcon="arrow-right" />
          </a>
          <a
            matButton="outlined"
            routerLink="/activities"
            class="min-h-12 rounded-md border-white/30 bg-transparent px-6 text-base font-semibold text-white">
            Nos activités
            <mat-icon class="ml-2 size-5" svgIcon="external-link" />
          </a>
        </nav>
      </div>
      <aside class="lg:col-span-5" aria-label="Galerie de vidéos">
        <div class="relative">
          <figure class="relative overflow-hidden rounded-md border border-white/20 bg-gray-900 shadow-theme-xl">
            <div class="aspect-video min-h-60">
              <iframe
                class="h-full w-full"
                src="https://www.youtube.com/embed/WAyROlGRliA"
                title="Vidéo de présentation Cinolu"
                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                  web-share;
                "
                allowfullscreen
                loading="eager"></iframe>
            </div>
          </figure>
        </div>
      </aside>
    </div>
  </div>
</section>
