<section class="relative z-0 flex min-h-[90vh] flex-col items-center justify-center">
  <div class="absolute inset-0 -z-10 overflow-hidden">
    <img src="/images/member.jpg" alt="" class="h-full w-full object-cover" loading="eager" decoding="async" />
    <div class="absolute inset-0 bg-slate-950/65"></div>
  </div>

  <div class="relative z-10 mx-auto w-full max-w-screen-2xl px-8 py-16 lg:px-16 lg:py-20 xl:px-24 2xl:px-32">
    <div class="grid grid-cols-1 gap-10 lg:grid-cols-12 lg:gap-16 content-center items-center">
      <div class="space-y-8 lg:col-span-6">
        <header class="space-y-8">
          <div class="space-y-6">
            <h1
              class="relative block text-4xl font-bold tracking-tight text-white hyphens-none sm:text-5xl lg:text-5xl">
              Bâtir le corridor d'innovation
              <span class="font-bold text-brand-400">de l'Afrique Centrale au monde.</span>
            </h1>
            <div class="h-1.5 w-32 rounded-full bg-brand-500"></div>
          </div>
          <p class="max-w-2xl text-base leading-relaxed font-bold text-slate-200 sm:text-lg">
            Nous relions l'innovation locale aux transformations mondiales en transformant les défis en opportunités de
            marché.
          </p>
        </header>
        <nav class="flex flex-col gap-4 pt-4 sm:flex-row" aria-label="Actions principales">
          <a matButton="filled" routerLink="/auth/sign-up" class="min-h-12 rounded-md px-3 text-base font-bold">
            Rejoignez l'aventure
            <mat-icon class="ml-2 size-5" svgIcon="arrow-right" />
          </a>
          <a
            matButton="outlined"
            routerLink="/activites"
            class="min-h-12 rounded-md border-white/25 bg-white/5 px-3 text-base font-bold text-white backdrop-blur-sm">
            Nos activités
            <mat-icon class="ml-2 size-5" svgIcon="external-link" />
          </a>
        </nav>
      </div>
      <aside class="lg:col-span-6" aria-label="Galerie de vidéos">
        <div class="relative">
          <figure class="relative overflow-hidden rounded-xl border-4 border-white/10 bg-white/5 backdrop-blur-sm">
            <div class="pointer-events-none absolute inset-0 z-20 rounded-xl border-2 border-white/5"></div>
            <div class="aspect-video">
              <iframe
                class="h-full w-full"
                src="https://www.youtube.com/embed/WAyROlGRliA"
                title="Vidéo de présentation Cinolu"
                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                  web-share;
                "
                allowfullscreen
                loading="eager"></iframe>
            </div>
          </figure>
        </div>
      </aside>
    </div>
  </div>
</section>
