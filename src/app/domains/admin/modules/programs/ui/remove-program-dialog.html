<h2 mat-dialog-title>Delete program</h2>
<mat-dialog-content>
  <p>
    Are you sure you want to delete <strong>{{ data.program.name }}</strong
    >? This action cannot be undone.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" [mat-dialog-close]="false">Cancel</button>
  <button matButton="filled" type="button" [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
