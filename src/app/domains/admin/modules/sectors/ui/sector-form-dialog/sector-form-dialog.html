<h2 mat-dialog-title>{{ data.sector ? 'Edit sector' : 'Create sector' }}</h2>
<form (submit)="onSubmit(); $event.preventDefault()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
      <mat-label>Name</mat-label><input matInput autocomplete="off" [formField]="sectorForm.name" />
      @if (sectorForm.name().touched() && sectorForm.name().errors().length) {
        <mat-error>{{ sectorForm.name().errors()[0].message }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button matButton="filled" type="submit" [disabled]="sectorForm().invalid()">
      {{ data.sector ? 'Save' : 'Create' }}
    </button>
  </mat-dialog-actions>
</form>
