<h2 mat-dialog-title>{{ data.type ? 'Edit type' : 'Create type' }}</h2>

<form (submit)="onSubmit(); $event.preventDefault()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
      <mat-label>Name</mat-label>
      <input matInput autocomplete="off" [formField]="typeForm.name" />
      @if (typeForm.name().touched() && typeForm.name().errors().length) {
        <mat-error>{{ typeForm.name().errors()[0].message }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button matButton="filled" type="submit" [disabled]="typeForm().invalid()">
      {{ data.type ? 'Save' : 'Create' }}
    </button>
  </mat-dialog-actions>
</form>
