<h2 mat-dialog-title>{{ data.category ? 'Edit category' : 'Create category' }}</h2>

<form (submit)="onSubmit(); $event.preventDefault()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
      <mat-label>Name</mat-label>
      <input matInput autocomplete="off" [formField]="categoryForm.name" />
      @if (categoryForm.name().touched() && categoryForm.name().errors().length) {
        <mat-error>{{ categoryForm.name().errors()[0].message }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button matButton="filled" type="submit" [disabled]="categoryForm().invalid()">
      {{ data.category ? 'Save' : 'Create' }}
    </button>
  </mat-dialog-actions>
</form>
